name: Track taxi squad moves

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Poll Sleeper and update taxi log
        run: node scripts/track-taxi.mjs

      - name: Commit changes if any
        run: |
          git config user.name "taxi-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/taxi-log.json data/roster-snapshot.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update taxi squad log [automated]"
            git push
          fi

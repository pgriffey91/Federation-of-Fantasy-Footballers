<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>League Activity Feed</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1 id="site-title">League Activity Feed</h1>
      <div class="header-meta">
        <span id="season-label"></span>
        <button id="refresh-btn" title="Reload live data from Sleeper">↻ Refresh</button>
      </div>
    </div>
  </header>

  <main>
    <section class="controls">
      <div class="control-group">
        <label for="team-filter">Team</label>
        <select id="team-filter">
          <option value="">All teams</option>
        </select>
      </div>

      <div class="control-group checkboxes">
        <label class="checkbox-pill"><input type="checkbox" value="add" checked> Adds</label>
        <label class="checkbox-pill"><input type="checkbox" value="drop" checked> Drops</label>
        <label class="checkbox-pill"><input type="checkbox" value="trade" checked> Trades</label>
        <label class="checkbox-pill"><input type="checkbox" value="taxi_add" checked> Taxi in</label>
        <label class="checkbox-pill"><input type="checkbox" value="taxi_remove" checked> Taxi out</label>
      </div>

      <div class="control-group">
        <label for="search-box">Search player</label>
        <input type="search" id="search-box" placeholder="Player name…">
      </div>
    </section>

    <div id="status-line" class="status-line">Loading league data from Sleeper…</div>

    <section id="feed" class="feed" aria-live="polite"></section>

    <div id="load-more-wrap" class="load-more-wrap" hidden>
      <button id="load-more-btn">Load more</button>
    </div>
  </main>

  <footer class="site-footer">
    <p>
      Data pulled live from the <a href="https://docs.sleeper.com/" target="_blank" rel="noopener">Sleeper API</a>.
      Taxi-squad history is captured by a scheduled GitHub Action since Sleeper doesn't expose it directly —
      see <code>data/taxi-log.json</code>.
    </p>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
